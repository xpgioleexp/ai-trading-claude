<!-- Local copy of play.html with a full document wrapper. Keep the two in sync. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Us Terrarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left"><span class="brand">Little Us</span><span id="pebbles" class="pebbles" aria-label="Pebbles">0</span><span id="partner" class="partner-chip" hidden></span></div>
    <div id="clock" class="clock"></div>
  </header>
  <main id="stage"><canvas id="game" width="320" height="384" aria-label="Your terrarium. Tap the ground to walk, tap things to use them."></canvas></main>
  <nav id="tray" aria-label="Tools">
    <button class="tray-btn" id="btn-bag" type="button">Bag</button>
    <button class="tray-btn" id="btn-today" type="button">Today</button>
    <button class="tray-btn" id="btn-mail" type="button">Mail</button>
    <button class="tray-btn" id="btn-journal" type="button">Journal</button>
    <button class="tray-btn" id="btn-build" type="button">Build</button>
    <button class="tray-btn" id="btn-more" type="button">More</button>
    <button class="tray-btn alt" id="btn-leave" type="button" hidden>Leave cave</button>
    <button class="tray-btn alt" id="btn-cancel" type="button" hidden>Stop placing</button>
  </nav>
  <div id="debug" hidden>
    <button class="btn" type="button" data-debug="day">Next day</button>
    <button class="btn" type="button" data-debug="night">Time of day</button>
    <button class="btn" type="button" data-debug="pebbles">+500 pebbles</button>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<section id="sheet" hidden role="dialog" aria-labelledby="sheet-title">
  <header><h2 id="sheet-title"></h2><button class="btn small" id="sheet-close" type="button">Close</button></header>
  <div id="sheet-body"></div>
</section>
<script type="module" src="src/main.js"></script>
</body>
</html>
