<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Little Us · Art gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f5f1e5;
      color: #38493d;
      font:
        15px/1.5 system-ui,
        sans-serif;
    }
    main {
      max-width: 1280px;
      margin: auto;
      padding: 32px 20px;
    }
    h1 {
      font-size: 28px;
      letter-spacing: -1px;
      margin: 0;
    }
    p {
      color: #6c7e55;
      margin: 5px 0 20px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: #f5f1e5ed;
      padding: 14px 0;
      z-index: 1;
    }
    input,
    select,
    button {
      font: inherit;
      padding: 9px 12px;
      border: 1px solid #c1c9ad;
      border-radius: 8px;
      background: #fffdf6;
      color: inherit;
    }
    input {
      flex: 1;
      min-width: 180px;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 12px;
    }
    figure {
      margin: 0;
      padding: 12px 8px;
      background: #e7ecd7;
      border-radius: 10px;
      min-width: 0;
    }
    .sprite {
      height: 112px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 8px;
      background-image:
        linear-gradient(45deg, #dde4cd40 25%, transparent 25%, transparent 75%, #dde4cd40 75%),
        linear-gradient(45deg, #dde4cd40 25%, transparent 25%, transparent 75%, #dde4cd40 75%);
      background-position:
        0 0,
        8px 8px;
      background-size: 16px 16px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      object-fit: contain;
    }
    figcaption {
      font:
        10px/1.5 ui-monospace,
        monospace;
      overflow-wrap: anywhere;
      padding-top: 10px;
      min-height: 42px;
    }
    .pager {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin: 24px 0;
    }
    a {
      color: #775b46;
    }
    #status {
      font-size: 13px;
    }
    label {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 13px;
    }
    input[type='checkbox'] {
      min-width: 0;
      flex: none;
    }
    footer {
      font-size: 12px;
      color: #6c7e55;
    }
  </style>
  <main>
    <h1>Little Us · Art gallery</h1>
    <p id="status">Rendering the catalog…</p>
    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Find an animal, item, decoration…"
        aria-label="Search art"
      />
      <select id="family" aria-label="Sprite family">
        <option value="">All families</option>
      </select>
      <label><input id="unique" type="checkbox" checked />Hide identical renders</label>
    </div>
    <div id="grid" aria-live="polite"></div>
    <div class="pager">
      <button id="previous">Previous</button><span id="page"></span><button id="next">Next</button>
    </div>
    <footer>
      All sprites retain their native sizes. Preview uses crisp integer scaling. Run the
      repository's web server to browse this gallery. <a href="../ART-STYLE.md">Art guide</a>
    </footer>
  </main>
  <script type="module" src="gallery.js"></script>
</html>
